---
- name: Configurar Docker y Docker Compose en servidor Noit
  hosts: all
  become: true
  gather_facts: true
  
  roles:
    - docker 

  tasks:
    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        
    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        
    - name: Install Docker packages
      apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes
        
    - name: Ensure docker group exists
      group:
        name: docker
        state: present
        
    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
        
    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: yes
        
    # Configura Docker para usar el volumen EBS para almacenar sus datos
    - name: Create directory for Docker data on EBS volume
      file:
        path: /data/docker
        state: directory
        mode: '0755'
        
    - name: Stop Docker service
      systemd:
        name: docker
        state: stopped
        
    - name: Create Docker daemon.json to store data on EBS
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "data-root": "/data/docker"
          }
        
    - name: Start Docker service again
      systemd:
        name: docker
        state: started 