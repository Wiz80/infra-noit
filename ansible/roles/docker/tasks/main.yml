---
- name: Actualizar paquetes
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalar paquetes necesarios
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Agregar clave GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Añadir repositorio de Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Instalar Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: Instalar Docker Compose 
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Iniciar y habilitar servicio Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Añadir usuario ubuntu al grupo docker
  user:
    name: ubuntu
    groups: docker
    append: yes 